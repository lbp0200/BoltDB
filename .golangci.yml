# https://golangci-lint.run/docs/product/migration-guide/
version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1001
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
