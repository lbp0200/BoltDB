name: Weekly Coverage Report

on:
  schedule:
    # 每周末 UTC 06:00 生成覆盖率报告
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        default: 'manual coverage check'
        required: false

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Generate coverage profile
        run: |
          go test -race -timeout 300s -short -p=2 -parallel=4 \
            -coverprofile=coverage.out -covermode=atomic \
            ./internal/... ./cmd/boltDB/... 2>&1

      - name: Generate HTML coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Generate package-level coverage summary
        run: |
          echo "## Package Coverage Summary" > coverage-summary.md
          echo '| Package | Coverage |' >> coverage-summary.md
          echo '|---------|----------|' >> coverage-summary.md
          go tool cover -func=coverage.out | while IFS= read -r line; do
            pkg=$(echo "$line" | awk '{print $1}')
            cov=$(echo "$line" | awk '{print $NF}')
            if [ -n "$pkg" ] && [ -n "$cov" ]; then
              echo "| $pkg | $cov |" >> coverage-summary.md
            fi
          done
          echo "" >> coverage-summary.md
          echo "> ⚠️ 行覆盖率仅供参考，不设为 CI 硬门禁。oracle 质量（mutation kill、RESP shape、regression）才是真正的质量门禁。" >> coverage-summary.md
          cat coverage-summary.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            coverage.html
            coverage-summary.md
            coverage.out
          retention-days: 30